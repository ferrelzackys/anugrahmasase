<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antrean Massage - Anugrah Sport Masase</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0;
      padding: 0;
    }
    
    body { 
      background: radial-gradient(circle at top right, #132f58 0%, #081427 100%); 
      margin: 0; 
      padding: 24px 16px; 
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1e293b;
    }

    .card { 
      width: 100%; 
      max-width: 420px; 
      background: #ffffff; 
      padding: 36px 28px; 
      border-radius: 24px; 
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1); 
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    /* Gradient Gold Accent Bar */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #c5a059 0%, #f3e5ab 50%, #c5a059 100%);
    }

    .logo-container { 
      text-align: center; 
      margin-bottom: 20px; 
    }

    .logo-container img { 
      width: 100px; 
      height: 100px; 
      object-fit: contain;
      filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.12));
      transition: transform 0.3s ease;
    }
    
    .logo-container img:hover {
      transform: scale(1.03);
    }

    h2 { 
      color: #0b1d3a; 
      text-align: center; 
      margin: 0; 
      font-size: 21px; 
      font-weight: 800; 
      letter-spacing: -0.3px;
    }

    p.subtitle { 
      text-align: center; 
      color: #b8860b; 
      font-size: 12px; 
      font-weight: 700; 
      margin: 6px 0 26px 0; 
      text-transform: uppercase; 
      letter-spacing: 0.8px; 
    }
    
    label { 
      font-weight: 600; 
      font-size: 13px; 
      display: block; 
      margin-top: 16px; 
      color: #334155; 
      letter-spacing: -0.1px;
    }

    input { 
      width: 100%; 
      padding: 13px 16px; 
      margin-top: 6px; 
      border: 1.5px solid #e2e8f0; 
      border-radius: 12px; 
      font-size: 14px;
      transition: all 0.25s ease-in-out;
      background: #f8fafc;
      color: #0f172a;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus { 
      border-color: #0b1d3a; 
      outline: none; 
      background: #ffffff; 
      box-shadow: 0 0 0 4px rgba(11, 29, 58, 0.08); 
    }

    /* Custom File Input Style */
    input[type="file"] {
      padding: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      background: #0b1d3a;
      color: #f3e5ab;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      margin-right: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    input[type="file"]::file-selector-button:hover {
      background: #163766;
    }

    button { 
      width: 100%; 
      padding: 15px; 
      background: linear-gradient(135deg, #0b1d3a 0%, #163766 100%); 
      color: #fce789; 
      border: 1px solid rgba(212, 175, 55, 0.4); 
      border-radius: 12px; 
      font-weight: 700; 
      margin-top: 28px; 
      cursor: pointer; 
      font-size: 15px; 
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(11, 29, 58, 0.25);
      transition: all 0.2s ease;
    }

    button:hover {
      box-shadow: 0 10px 24px rgba(11, 29, 58, 0.35);
      transform: translateY(-1px);
    }

    button:active { 
      transform: translateY(1px); 
      box-shadow: 0 4px 12px rgba(11, 29, 58, 0.2);
    }

    button:disabled {
      background: #94a3b8;
      border-color: transparent;
      box-shadow: none;
      cursor: not-allowed;
      color: #ffffff;
    }
    
    /* Ticket Badge */
    #ticket { 
      display: none; 
      text-align: center; 
      background: #f8fafc; 
      padding: 28px 20px; 
      border-radius: 18px; 
      border: 2px dashed #c5a059; 
      margin-top: 10px; 
      box-shadow: inset 0 0 12px rgba(197, 160, 89, 0.05);
    }

    .ticket-header { 
      font-size: 12px; 
      color: #64748b; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 1px;
    }

    .number { 
      font-size: 52px; 
      font-weight: 800; 
      color: #0b1d3a; 
      margin: 12px 0; 
      letter-spacing: -1px;
      text-shadow: 2px 2px 0px rgba(243, 229, 171, 0.6); 
    }

    .display-name { 
      font-size: 15px; 
      font-weight: 600; 
      color: #334155; 
      margin-bottom: 20px; 
    }

    .note { 
      font-size: 12px; 
      color: #713f12; 
      background: #fefce8; 
      padding: 12px 14px; 
      border-radius: 10px; 
      border-left: 4px solid #c5a059;
      text-align: left;
      line-height: 1.5;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-container">
    <img src="logo.JPG" alt="Logo Anugrah Sport Masase">
  </div>
  <h2>ANUGRAH SPORT MASASE</h2>
  <p class="subtitle">Latbar 1st Anniversary Delta Trail Running</p>
  
  <form id="queueForm">
    <label>Nama Lengkap</label>
    <input type="text" name="nama" required placeholder="Masukkan nama lengkap Anda">
    
    <label>Nomor BIB</label>
    <input type="number" name="bib" required placeholder="Contoh: 1024">
    
    <label>Nomor WhatsApp</label>
    <input type="tel" name="wa" required placeholder="Contoh: 081234567890">
    
    <label>Upload Bukti Follow IG @anugrahsportmasase</label>
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/heic,image/heif" required>
    
    <button type="submit" id="submitBtn">AMBIL NOMOR ANTREAN</button>
  </form>

  <div id="ticket">
    <div class="ticket-header">Nomor Antrean Anda</div>
    <div class="number" id="queueDisplay">DTR-000</div>
    <div class="display-name" id="displayName"></div>
    <div class="note">
      ⚠️ <strong>PENTING:</strong> Silakan <strong>Screenshot</strong> layar ini dan tunjukkan kepada tim medis/masase di booth saat nomor Anda dipanggil.
    </div>
  </div>
</div>

<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycbw-G2m7xDJC4Gggnw6NWBGskiDu_I1b8KXhxGZ4dFwfJsCUJKqwrOJu4qx_9QUxq6cMiA/exec";
  const form = document.getElementById('queueForm');
  const submitBtn = document.getElementById('submitBtn');
  const ticket = document.getElementById('ticket');
  const fileInput = document.getElementById('fileInput');

  function compressImage(file, maxWidth, quality, callback) {
    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        callback(dataUrl);
      };
      img.onerror = function() {
        callback(event.target.result);
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    submitBtn.innerText = "MENGUNGGAH & MEMPROSES...";
    submitBtn.disabled = true;

    const file = fileInput.files[0];

    if (!file) {
      alert("Silakan pilih file gambar bukti terlebih dahulu.");
      submitBtn.innerText = "AMBIL NOMOR ANTREAN";
      submitBtn.disabled = false;
      return;
    }

    compressImage(file, 800, 0.7, function(base64File) {
      const payload = new URLSearchParams();
      payload.append("nama", form.nama.value);
      payload.append("bib", form.bib.value);
      payload.append("wa", form.wa.value);
      payload.append("buktiFile", base64File);
      payload.append("fileName", "Bukti_" + form.bib.value + ".jpg");

      fetch(scriptURL, { 
        method: 'POST', 
        body: payload,
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        }
      })
      .then(response => response.json())
      .then(data => {
        if (data.result === 'success') {
          form.style.display = 'none';
          document.getElementById('queueDisplay').innerText = data.queueNumber;
          document.getElementById('displayName').innerText = form.nama.value + " (BIB: " + form.bib.value + ")";
          ticket.style.display = 'block';
        } else {
          alert("Gagal memproses data: " + (data.error || "Terjadi kesalahan"));
          submitBtn.innerText = "AMBIL NOMOR ANTREAN";
          submitBtn.disabled = false;
        }
      })
      .catch(error => {
        console.warn("Fetch Notice:", error);
        form.style.display = 'none';
        document.getElementById('queueDisplay').innerText = "BERHASIL!";
        document.getElementById('displayName').innerText = form.nama.value + " (BIB: " + form.bib.value + ")";
        ticket.style.display = 'block';
      });
    });
  });
</script>

</body>
                                                   </html>
